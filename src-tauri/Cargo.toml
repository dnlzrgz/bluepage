[package]
name = "bluepage"
version = "0.1.7"
description = "A journal application"
authors = ["dnlzrgz <contact@dnlzrgz.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "bluepage_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
